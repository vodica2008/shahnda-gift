<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A gift for Shahd 💖</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tahoma', sans-serif;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .card h2 {
            color: #ff4757;
            margin-bottom: 10px;
        }
        .name {
            color: #ff6b81;
            font-size: 2rem;
            margin: 10px 0;
        }
        .cake-container {
            font-size: 60px;
            margin: 20px 0;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 8px 0;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
        }
        button:hover {
            background-color: #ff6b81;
            transform: translateY(-2px);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 25px;
            border-radius: 15px;
            width: 80%;
            max-width: 450px;
            text-align: right;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
        }
        .close-btn {
            color: #aaa;
            position: absolute;
            left: 15px;
            top: 10px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn:hover {
            color: #000;
        }
        #typingText {
            font-size: 1.1rem;
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>أختي الغالية 💖</h2>
        <h1 class="name">شاهنده</h1>
        <p>كل سنة وأنتي أجمل أخت في الدنيا 🌸</p>
        
        <div class="cake-container">
            🎂
        </div>

        <button id="confettiBtn">💖 كل سنة وأنتي طيبة يا شاهنده</button>
        <button id="openBtn">💌 افتحي الرسالة</button>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>شاهنده 💔</h2>
            <p id="typingText"></p>
        </div>
    </div>

    <audio id="bgMusic" src="https://www.bensound.com/bensound-music/bensound-cute.mp3" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const confettiBtn = document.getElementById('confettiBtn');
        const openBtn = document.getElementById('openBtn');
        const modal = document.getElementById('modal');
        const closeBtn = document.querySelector('.close-btn');
        const music = document.getElementById('bgMusic');
        const typingTextElement = document.getElementById('typingText');

        const message = `كل سنة وأنتي طيبة يا حبيبتي وعقبال مليون سنة وكل سنة وأنتي معايا. طبعا مش مجرد ويب سايت بقدر أوصلك أنا بحبك قد إيه، وأنا عارف إنك عندك شوية بس هعمل إيه أنا بحبك بجد وربنا يخليكي لنا بكل حاجة لنا وأنا بحبكيكيكيكيكيكيكيكيكيكيكيكيكيكيكيكيكى ❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️`;

        let i = 0;
        function typeWriter() {
            if (i < message.length) {
                typingTextElement.textContent += message.charAt(i);
                i++;
                setTimeout(typeWriter, 35);
            }
        }

        confettiBtn.addEventListener('click', () => {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
            music.play().catch(() => {});
        });

        openBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
            if (typingTextElement.textContent === '') {
                i = 0;
                typeWriter();
            }
            music.play().catch(() => {});
        });

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
